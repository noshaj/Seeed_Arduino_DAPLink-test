name: Build DAPLink for XIAO nRF52840
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Install Seeed nRF52 Platform
        run: |
          arduino-cli core update-index --additional-urls https://seeedstudio.com
          arduino-cli core install Seeeduino:nrf52 --additional-urls https://seeedstudio.com

      - name: Install Dependencies
        run: |
          arduino-cli lib install "Adafruit TinyUSB Library"
          # Link the current repo as a library
          mkdir -p $HOME/Arduino/libraries
          ln -s $GITHUB_WORKSPACE $HOME/Arduino/libraries/Seeed_Arduino_DAPLink

      - name: Compile simple_daplink
        run: |
          arduino-cli compile --fqbn Seeeduino:nrf52:xiaonRF52840Sense \
          --output-dir ./build \
          $GITHUB_WORKSPACE/examples/simple_daplink/simple_daplink.ino

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daplink-firmware
          path: ./build/*.hex
