name: Build DAPLink for XIAO nRF52840
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install nRF Util
        run: pip3 install adafruit-nrfutil

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Install Platforms and Seeed Core
        run: |
          rm -rf /home/runner/.arduino15
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://adafruit.github.io/arduino-board-index/package_adafruit_index.json
          arduino-cli config add board_manager.additional_urls https://files.seeedstudio.com/arduino/package_seeeduino_boards_index.json
          arduino-cli core update-index
          arduino-cli core install Seeeduino:nrf52

      - name: Setup Workspace Libraries
        run: |
          mkdir -p $HOME/Arduino/libraries
          ln -s $GITHUB_WORKSPACE $HOME/Arduino/libraries/Seeed_Arduino_DAPLink

      - name: Compile simple_daplink
        run: |
          # Keep the USB flags but simplify them to prevent binary bloat
          arduino-cli compile --fqbn Seeeduino:nrf52:xiaonRF52840Sense \
            --build-property "compiler.cpp.extra_flags=-DUSE_TINYUSB -DUSB_VID=0x2886 -DUSB_PID=0x8045" \
            --output-dir ./build \
            $GITHUB_WORKSPACE/examples/simple_daplink/simple_daplink.ino

      - name: Create UF2 Converter
        run: |
          # Download the OFFICIAL Adafruit converter script (the industry standard)
          curl -L "https://githubusercontent.com" -o uf2conv.py

      - name: Convert to UF2 and Run
        run: |
          # Use the official script with the verified Family ID 0xADA52840
          # -c means convert to UF2, -f specifies the Family ID
          python3 uf2conv.py -c -f 0xADA52840 -o ./build/XIAO_DAPLINK.uf2 ./build/simple_daplink.ino.hex

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiao-daplink-uf2
          path: ./build/XIAO_DAPLINK.uf2
