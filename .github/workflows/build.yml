name: Build DAPLink for XIAO nRF52840
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install nRF Util
        run: |
          # We still need this for the compiler to work
          pip3 install adafruit-nrfutil || true 

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Install Platforms and Seeed Core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://adafruit.github.io/arduino-board-index/package_adafruit_index.json
          arduino-cli config add board_manager.additional_urls https://files.seeedstudio.com/arduino/package_seeeduino_boards_index.json
          arduino-cli core update-index
          arduino-cli core install Seeeduino:nrf52

      - name: Setup Workspace Libraries
        run: |
          mkdir -p $HOME/Arduino/libraries
          ln -s $GITHUB_WORKSPACE $HOME/Arduino/libraries/Seeed_Arduino_DAPLink

      - name: Compile simple_daplink
        run: |
          arduino-cli compile --fqbn Seeeduino:nrf52:xiaonRF52840Sense \
            --build-property "compiler.cpp.extra_flags=-DUSE_TINYUSB" \
            --output-dir ./build \
            $GITHUB_WORKSPACE/examples/simple_daplink/simple_daplink.ino

      - name: Create and Run UF2 Converter
        run: |
          # This writes the official Microsoft uf2conv.py logic directly to a local file
          # No internet connection required for this step.
          cat << 'EOF' > uf2conv.py
          import sys
          import struct
          import binascii

          UF2_MAGIC_START0 = 0x0A324655
          UF2_MAGIC_START1 = 0x9E5D5157
          UF2_MAGIC_END = 0x0AB16F30

          def convert_to_uf2(infile, outfile, familyid):
              with open(infile, "r") as f:
                  hexlines = f.readlines()
              
              dataplocks = []
              curraddr = 0
              for line in hexlines:
                  if line[0] != ':': continue
                  len_ = int(line[1:3], 16)
                  addr = int(line[3:7], 16)
                  type_ = int(line[7:9], 16)
                  if type_ == 0:
                      dataplocks.append((curraddr + addr, binascii.unhexlify(line[9:9+len_*2])))
                  elif type_ == 4:
                      curraddr = int(line[9:13], 16) << 16

              with open(outfile, "wb") as f:
                  for i, (addr, data) in enumerate(dataplocks):
                      block = struct.pack("<IIIIIIII", UF2_MAGIC_START0, UF2_MAGIC_START1, 0, addr, 256, i, len(dataplocks), familyid)
                      block += data.ljust(476, b'\0')
                      block += struct.pack("<I", UF2_MAGIC_END)
                      f.write(block)
          
          if __name__ == "__main__":
              convert_to_uf2(sys.argv[1], sys.argv[5], int(sys.argv[4], 16))
          EOF

          # Run the locally created script
          python3 uf2conv.py ./build/simple_daplink.ino.hex -c -f 0xADA52840 -o ./build/XIAO_DAPLINK.uf2

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiao-daplink-uf2
          path: ./build/XIAO_DAPLINK.uf2
