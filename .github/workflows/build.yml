name: Build DAPLink for XIAO nRF52840
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Install Platforms and Seeed Core
        run: |
          # Use both URLs from your screenshot, comma-separated
          URLS="https://github.io"
          
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls $URLS
          arduino-cli core update-index
          arduino-cli core install Seeeduino:nrf52

      - name: Install Dependencies
        run: |
          # The Adafruit core URL (from your screenshot) is often needed for TinyUSB dependencies
          arduino-cli lib install "Adafruit TinyUSB Library"
          mkdir -p $HOME/Arduino/libraries
          ln -s $GITHUB_WORKSPACE $HOME/Arduino/libraries/Seeed_Arduino_DAPLink

      - name: Compile simple_daplink
        run: |
          # Target the XIAO nRF52840 Sense FQBN
          arduino-cli compile --fqbn Seeeduino:nrf52:xiaonRF52840Sense \
            --build-property "compiler.cpp.extra_flags=-DUSE_TINYUSB" \
            --output-dir ./build \
            $GITHUB_WORKSPACE/examples/simple_daplink/simple_daplink.ino

      - name: Convert HEX to UF2
        run: |
          # Fetch the official conversion script
          wget https://githubusercontent.com
          # Convert to UF2 using the XIAO nRF52840 family ID (0xADA52840)
          python3 uf2conv.py ./build/simple_daplink.ino.hex -c -f 0xADA52840 -o ./build/XIAO_DAPLINK.uf2

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiao-daplink-uf2
          path: ./build/XIAO_DAPLINK.uf2
