name: Build DAPLink for XIAO nRF52840
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install nRF Util
          # Required by Seeed core to compile for nRF52 series
        run: pip3 install adafruit-nrfutil

      - name: Manual Arduino CLI Setup
        run: |
          # 1. Download and install CLI to a local bin folder to bypass corrupted global setup
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          
          # 2. Define a 100% local config in the workspace
          # This overrides the default /home/runner/.arduino15 directory entirely
          cat << 'EOF' > local-arduino-cli.yaml
          board_manager:
            additional_urls:
              - https://github.io
              - https://seeedstudio.com
          directories:
            data: ./arduino_data
            downloads: ./arduino_downloads
            user: ./arduino_user
          EOF

          # 3. Force CLI to use this specific config for all operations
          ./bin/arduino-cli core update-index --config-file local-arduino-cli.yaml
          ./bin/arduino-cli core install Seeeduino:nrf52 --config-file local-arduino-cli.yaml

      - name: Setup Workspace Libraries
        run: |
          mkdir -p $HOME/Arduino/libraries
          ln -s $GITHUB_WORKSPACE $HOME/Arduino/libraries/Seeed_Arduino_DAPLink

      - name: Compile simple_daplink
        run: |
          # Use the local binary and the local config to ensure isolation
          ./bin/arduino-cli compile --fqbn Seeeduino:nrf52:xiaonRF52840Sense \
            --build-property "compiler.cpp.extra_flags=-DUSE_TINYUSB" \
            --output-dir ./build \
            --config-file local-arduino-cli.yaml \
            $GITHUB_WORKSPACE/examples/simple_daplink/simple_daplink.ino

      - name: Create and Run UF2 Converter
        run: |
          # This embedded Python script bypasses all wget/curl DNS resolution errors
          cat << 'EOF' > uf2conv.py
          import sys, struct, binascii, os
          def convert_to_uf2(infile, outfile, familyid):
              if not os.path.exists(infile):
                  print(f"Error: {infile} not found"); sys.exit(1)
              with open(infile, "r") as f: lines = f.readlines()
              dataplocks = []; curr_upper_addr = 0
              for line in lines:
                  line = line.strip()
                  if not line.startswith(':'): continue
                  length, addr, rectype = int(line[1:3], 16), int(line[3:7], 16), int(line[7:9], 16)
                  data = line[9:9+length*2]
                  if rectype == 0: dataplocks.append((curr_upper_addr + addr, binascii.unhexlify(data)))
                  elif rectype == 4: curr_upper_addr = int(data, 16) << 16
              with open(outfile, "wb") as f:
                  num_blocks = len(dataplocks)
                  for i, (addr, data) in enumerate(dataplocks):
                      block = struct.pack("<IIIIIIII", 0x0A324655, 0x9E5D5157, 0x00002000, addr, 256, i, num_blocks, familyid)
                      block += data.ljust(476, b'\0')
                      block += struct.pack("<I", 0x0AB16F30)
                      f.write(block)
              print(f"Successfully created {outfile}")
          if __name__ == "__main__":
              # Generic nRF52840 ID for best bootloader compatibility
              convert_to_uf2("./build/simple_daplink.ino.hex", "./build/XIAO_DAPLINK.uf2", 0x7e3d3dec)
          EOF
          python3 uf2conv.py

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiao-daplink-uf2
          path: ./build/XIAO_DAPLINK.uf2
