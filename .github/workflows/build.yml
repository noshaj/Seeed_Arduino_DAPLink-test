name: Build DAPLink for XIAO nRF52840
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install nRF Util
        run: pip3 install adafruit-nrfutil

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Install Platforms and Seeed Core
        run: |
          # 1. KILL the corrupted global folder that holds the 'github.io' ghost URLs
          rm -rf /home/runner/.arduino15
          arduino-cli config init --overwrite
          
          # 2. FULL VERIFIED URLS (MATCHING YOUR SCREENSHOT EXACTLY)
          arduino-cli config add board_manager.additional_urls https://adafruit.github.io/arduino-board-index/package_adafruit_index.json
          arduino-cli config add board_manager.additional_urls https://files.seeedstudio.com/arduino/package_seeeduino_boards_index.json
          
          # 3. Update index and install the Seeed nRF52 core
          arduino-cli core update-index
          arduino-cli core install Seeeduino:nrf52

      - name: Setup Workspace Libraries
        run: |
          mkdir -p $HOME/Arduino/libraries
          ln -s $GITHUB_WORKSPACE $HOME/Arduino/libraries/Seeed_Arduino_DAPLink

      - name: Compile simple_daplink
        run: |
          # FQBN for Seeed Studio XIAO nRF52840 Sense
          arduino-cli compile --fqbn Seeeduino:nrf52:xiaonRF52840Sense \
            --build-property "compiler.cpp.extra_flags=-DUSE_TINYUSB" \
            --output-dir ./build \
            $GITHUB_WORKSPACE/examples/simple_daplink/simple_daplink.ino

      - name: Create and Run UF2 Converter
        run: |
          # Robust Python script to handle 256-byte alignment required by nRF52 bootloaders
          cat << 'EOF' > uf2conv.py
          import sys, struct, os

          def convert(infile, outfile, familyid):
              with open(infile, "r") as f:
                  lines = f.readlines()
              
              data = {}
              base_addr = 0
              for line in lines:
                  if not line.startswith(":"): continue
                  byte_count = int(line[1:3], 16)
                  addr = int(line[3:7], 16)
                  record_type = int(line[7:9], 16)
                  content = line[9:9+byte_count*2]
                  
                  if record_type == 0:
                      full_addr = base_addr + addr
                      for i in range(byte_count):
                          data[full_addr + i] = int(content[i*2:i*2+2], 16)
                  elif record_type == 4:
                      base_addr = int(content, 16) << 16

              addresses = sorted(data.keys())
              if not addresses: return
              
              with open(outfile, "wb") as f:
                  num_blocks = (max(addresses) - min(addresses) + 256) // 256
                  block_idx = 0
                  for start_addr in range(min(addresses) & ~0xff, max(addresses) + 1, 256):
                      block_content = bytearray(256)
                      has_data = False
                      for i in range(256):
                          if (start_addr + i) in data:
                              block_content[i] = data[start_addr + i]
                              has_data = True
                      if has_data:
                          # Header: Magic0, Magic1, Flags (0x2000), Addr, Size(256), Index, Total, FamilyID
                          header = struct.pack("<IIIIIIII", 0x0A324655, 0x9E5D5157, 0x00002000, start_addr, 256, block_idx, num_blocks, familyid)
                          f.write(header + block_content.ljust(476, b'\0') + struct.pack("<I", 0x0AB16F30))
                          block_idx += 1
          if __name__ == "__main__":
              convert("./build/simple_daplink.ino.hex", "./build/XIAO_DAPLINK.uf2", 0xADA52840)
          EOF
          python3 uf2conv.py

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiao-daplink-uf2
          path: ./build/XIAO_DAPLINK.uf2
