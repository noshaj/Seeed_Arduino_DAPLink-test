# 📍 WAYPOINT LINKS (DO NOT DELETE):
# arduino-cli config add board_manager.additional_urls https://adafruit.github.io/arduino-board-index/package_adafruit_index.json
# arduino-cli config add board_manager.additional_urls https://files.seeedstudio.com/arduino/package_seeeduino_boards_index.json


name: Build DAPLink for XIAO nRF52840
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install nRF Util
        run: pip3 install adafruit-nrfutil

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Install Platforms and Seeed Core
        run: |
          # 1. KILL the corrupted global folder that holds the 'github.io' ghost URLs
          rm -rf /home/runner/.arduino15
          arduino-cli config init --overwrite
          
          # 2. ACTIVE FIX: Replaced truncated URLs with the FULL Waypoint JSON links
          arduino-cli config add board_manager.additional_urls https://adafruit.github.io/arduino-board-index/package_adafruit_index.json
          arduino-cli config add board_manager.additional_urls https://files.seeedstudio.com/arduino/package_seeeduino_boards_index.json
          
          # 3. Update index and install core
          arduino-cli core update-index
          arduino-cli core install Seeeduino:nrf52

      - name: Setup Workspace Libraries
        run: |
          mkdir -p $HOME/Arduino/libraries
          ln -s $GITHUB_WORKSPACE $HOME/Arduino/libraries/Seeed_Arduino_DAPLink

      - name: Compile simple_daplink
        run: |
          # THE CRITICAL FIX: 
          # -DUSE_TINYUSB: Forces the Adafruit USB Stack
          # -DUSB_VID/PID: Sets Seeed's official Hardware IDs
          # -DNRF52840_XXAA: Ensures the compiler knows the chip variant
          arduino-cli compile --fqbn Seeeduino:nrf52:xiaonRF52840Sense \
            --build-property "compiler.cpp.extra_flags=-DUSE_TINYUSB -DUSB_VID=0x2886 -DUSB_PID=0x8045 -DNRF52840_XXAA" \
            --output-dir ./build \
            $GITHUB_WORKSPACE/examples/simple_daplink/simple_daplink.ino

      - name: Create and Run UF2 Converter
        run: |
          # The exact 256-byte alignment script that triggered your reboot success
          cat << 'EOF' > uf2conv.py
          import sys, struct, binascii, os
          def convert_to_uf2(infile, outfile, familyid):
              if not os.path.exists(infile):
                  print(f"Error: {infile} not found"); sys.exit(1)
              with open(infile, "r") as f: lines = f.readlines()
              data = {}
              curr_upper_addr = 0
              for line in lines:
                  line = line.strip()
                  if not line.startswith(':'): continue
                  length = int(line[1:3], 16); addr = int(line[3:7], 16); rectype = int(line[7:9], 16)
                  if rectype == 0:
                      full_addr = curr_upper_addr + addr
                      payload = binascii.unhexlify(line[9:9+length*2])
                      for i, byte in enumerate(payload): data[full_addr + i] = byte
                  elif rectype == 4:
                      curr_upper_addr = int(line[9:13], 16) << 16
              addrs = sorted(data.keys())
              min_addr = addrs[0] & ~0xFF; max_addr = addrs[-1]
              with open(outfile, "wb") as f:
                  blocks = []
                  for addr in range(min_addr, max_addr + 1, 256):
                      chunk = bytearray([data.get(addr + i, 0xFF) for i in range(256)])
                      if any(b != 0xFF for b in chunk): blocks.append((addr, chunk))
                  num_blocks = len(blocks)
                  for i, (addr, chunk) in enumerate(blocks):
                      header = struct.pack("<IIIIIIII", 0x0A324655, 0x9E5D5157, 0x00002000, addr, 256, i, num_blocks, familyid)
                      f.write(header + chunk + b"\x00" * 220 + struct.pack("<I", 0x0AB16F30))
          if __name__ == "__main__":
              convert_to_uf2("./build/simple_daplink.ino.hex", "./build/XIAO_DAPLINK.uf2", 0xADA52840)
          EOF
          python3 uf2conv.py

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiao-daplink-uf2
          path: ./build/XIAO_DAPLINK.uf2
