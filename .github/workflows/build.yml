name: Build DAPLink for XIAO nRF52840
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Install Seeed nRF52 Platform
        run: |
          rm -rf ~/.arduino15/arduino-cli.yaml
          BOARD_URL="https://files.seeedstudio.com/arduino/package_seeeduino_boards_index.json"
          arduino-cli core update-index --additional-urls $BOARD_URL
          arduino-cli core install Seeeduino:nrf52 --additional-urls $BOARD_URL

      - name: Install Dependencies
        run: |
          arduino-cli lib install "Adafruit TinyUSB Library"
          mkdir -p $HOME/Arduino/libraries
          ln -s $GITHUB_WORKSPACE $HOME/Arduino/libraries/Seeed_Arduino_DAPLink

      - name: Compile simple_daplink
        run: |
          # The board name in the CLI is slightly different from the IDE
          arduino-cli compile --fqbn Seeeduino:nrf52:xiaonRF52840Sense \
          --build-property "build.extra_flags=-DUSE_TINYUSB" \
          --output-dir ./build \
          $GITHUB_WORKSPACE/examples/simple_daplink/simple_daplink.ino

      - name: Convert HEX to UF2
        run: |
          # Correct link to download the converter script
          wget https://githubusercontent.com
          # Run conversion (Family ID 0xADA52840 is for nRF52840)
          python3 uf2conv.py ./build/simple_daplink.ino.hex -c -f 0xADA52840 -o ./build/XIAO_DAPLINK.uf2

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiao-daplink-uf2
          path: ./build/XIAO_DAPLINK.uf2
