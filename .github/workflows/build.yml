name: Build DAPLink for XIAO nRF52840
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install nRF Util
        run: |
          pip3 install adafruit-nrfutil

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Install Platforms and Seeed Core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://github.io
          arduino-cli config add board_manager.additional_urls https://seeedstudio.com
          arduino-cli core update-index
          arduino-cli core install Seeeduino:nrf52

      - name: Setup Workspace Libraries
        run: |
          mkdir -p $HOME/Arduino/libraries
          ln -s $GITHUB_WORKSPACE $HOME/Arduino/libraries/Seeed_Arduino_DAPLink

      - name: Compile simple_daplink
        run: |
          # Target the XIAO nRF52840 Sense
          arduino-cli compile --fqbn Seeeduino:nrf52:xiaonRF52840Sense \
            --build-property "compiler.cpp.extra_flags=-DUSE_TINYUSB" \
            --output-dir ./build \
            $GITHUB_WORKSPACE/examples/simple_daplink/simple_daplink.ino

      - name: Create and Run UF2 Converter
        run: |
          # Write the updated conversion script with the generic nRF52840 ID
          cat << 'EOF' > uf2conv.py
          import sys, struct, binascii, os

          def convert_to_uf2(infile, outfile, familyid):
              if not os.path.exists(infile):
                  print(f"Error: {infile} not found")
                  sys.exit(1)
              with open(infile, "r") as f:
                  lines = f.readlines()
              
              dataplocks = []
              curr_upper_addr = 0
              for line in lines:
                  line = line.strip()
                  if not line.startswith(':'): continue
                  length = int(line[1:3], 16)
                  addr = int(line[3:7], 16)
                  rectype = int(line[7:9], 16)
                  data = line[9:9+length*2]
                  if rectype == 0: 
                      dataplocks.append((curr_upper_addr + addr, binascii.unhexlify(data)))
                  elif rectype == 4: 
                      curr_upper_addr = int(data, 16) << 16

              with open(outfile, "wb") as f:
                  num_blocks = len(dataplocks)
                  for i, (addr, data) in enumerate(dataplocks):
                      # Block header: Start0, Start1, Flags (FamilyID present), Addr, Size, Index, Total, FamilyID
                      block = struct.pack("<IIIIIIII", 0x0A324655, 0x9E5D5157, 0x00002000, addr, 256, i, num_blocks, familyid)
                      block += data.ljust(476, b'\0')
                      block += struct.pack("<I", 0x0AB16F30)
                      f.write(block)
              print(f"Successfully created {outfile} with Family ID {hex(familyid)}")

          if __name__ == "__main__":
              # Using the Generic nRF52840 ID (0x7e3d3dec) for maximum bootloader compatibility
              convert_to_uf2("./build/simple_daplink.ino.hex", "./build/XIAO_DAPLINK.uf2", 0x7e3d3dec)
          EOF

          python3 uf2conv.py

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiao-daplink-uf2
          path: ./build/XIAO_DAPLINK.uf2
